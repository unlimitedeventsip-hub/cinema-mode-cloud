name: Build Cinema Mode Projector APK
on:
  push:
    branches: [main]
    paths:
      - "android-projector-app/**"
      - ".github/workflows/projector-apk.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          SDK_HOME="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$SDK_HOME" --install "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_HOME" >> "$GITHUB_ENV"
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile installable APK
        run: gradle -p android-projector-app assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinema-mode-projector-debug-apk
          path: android-projector-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
