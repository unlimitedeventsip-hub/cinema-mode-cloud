name: Verify Cinema Mode web build
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.html"
      - "package.json"
      - "functions/**"
      - "public/**"
      - "wrangler.jsonc"
      - ".github/workflows/cinema-web-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: test -f dist/index.html && test -f dist/manifest.webmanifest
